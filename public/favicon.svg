<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1a2332"/>

  <!-- Spire -->
  <polygon points="16,2 14.2,13 17.8,13" fill="#8ab4d4"/>

  <!-- Upper observation deck -->
  <rect x="8" y="12" width="16" height="3" rx="1.5" fill="#4a7fa4"/>
  <rect x="6" y="14" width="20" height="2.5" rx="1" fill="#3d6a94"/>

  <!-- Shaft -->
  <rect x="14.5" y="16.5" width="3" height="10" fill="#8ab4d4"/>

  <!-- Three legs -->
  <line x1="16" y1="26" x2="7" y2="31" stroke="#5a7fa4" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="25" y2="31" stroke="#5a7fa4" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="31" stroke="#5a7fa4" stroke-width="2" stroke-linecap="round"/>
</svg>
