<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1a2332"/>

  <!-- Business card body -->
  <rect x="3" y="9" width="26" height="16" rx="2" fill="#3d5a80"/>

  <!-- Card shine/highlight -->
  <rect x="3" y="9" width="26" height="5" rx="2" fill="#4a6d96"/>
  <rect x="3" y="12" width="26" height="2" fill="#4a6d96"/>

  <!-- Avatar circle (left side of card) -->
  <circle cx="10" cy="17" r="3.5" fill="#1a2332" opacity="0.6"/>
  <circle cx="10" cy="17" r="2.5" fill="#8ab4d4" opacity="0.8"/>

  <!-- Name line -->
  <rect x="16" y="14.5" width="10" height="2" rx="1" fill="white" opacity="0.9"/>

  <!-- Sub-text lines -->
  <rect x="16" y="18" width="7" height="1.5" rx="0.75" fill="white" opacity="0.5"/>
  <rect x="16" y="21" width="9" height="1.5" rx="0.75" fill="white" opacity="0.5"/>
</svg>
